# Files copied from the source worktree into newly-created worktrees.
[sync]
include = [
  ".claude/settings.local.json",
  ".agents/skills/",
  "docs/plans/",
]
# Symlink to the main worktree's copy instead of copying, so every worktree
# shares one file. Never list node_modules. See docs/configuration.md.
# link = [".claude/settings.local.json", ".codemap/", "ideas/"]

# Per-worktree artifact generated by treepad sync and treepad new.
# Remove this section to skip artifact generation (e.g. for JetBrains / Neovim).
[artifact]
filename = "{{.Slug}}-{{.Branch}}.code-workspace"
content = """
{
  "folders": [
    {{- range $i, $w := .Worktrees}}
    {{- if $i}},{{end}}
    {"name": "{{$w.Branch}}", "path": "{{$w.RelPath}}"}
    {{- end}}
  ]
}
"""

# Command run when --open is passed to treepad new.
# {{.ArtifactPath}} is the absolute path of the generated artifact, or the
# worktree directory when no [artifact] section is configured.
[open]
command = ["open", "{{.ArtifactPath}}"]

# Commands run at lifecycle events. See docs/hooks.md for the full event
# list and template variables. post_config_init fires once, right after this
# file is written by tp config init. Set interactive = true on any entry whose
# command needs to prompt; without it the command gets no terminal and its
# output is discarded.
# [[hooks.post_config_init]]
# command = "npx skills add code-review tdd"
# interactive = true

# Configuration for tp new --ticket. Resolves the ticket to a URL, creates the
# worktree, and hands the URL to an agent. treepad never reads the tracker; the
# agent fetches the ticket body itself.
# Set ticket_url to accept bare refs, e.g.
# ticket_url = "https://linear.app/acme/issue/{{.Ref}}"
# Without it, only full ticket URLs resolve.
# agent_command elements are text/template strings with data:
# .Branch, .Slug, .WorktreePath, .TicketURL.
[from_spec]
agent_command = ["claude", "{{.TicketURL}}"]
